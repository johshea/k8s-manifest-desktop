name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Manifest generator tests
        run: python tests/test_generator.py
      - name: Cluster config tests
        run: python tests/test_cluster_config.py
      - name: Cluster platform tests (offline)
        run: python tests/test_cluster_platforms.py
      - name: Application template tests
        run: python tests/test_app_templates.py
      - name: Networking & Storage add-on tests
        run: python tests/test_addons.py
      - name: Hover-help coverage
        run: python tests/test_field_docs.py
      # The GUI smoke test needs a display: Xvfb on Linux. macOS runners have no usable
      # window server for Tk in CI, so the GUI test only runs on Ubuntu.
      - name: GUI smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1400x900x24" python tests/gui_smoke_test.py
